name: Aggiornamento dati e dashboard

on:
  schedule:
    - cron: "40 22 * * 1-5"   # ogni giorno lavorativo: prezzi e punteggio (00:40 ora italiana)
    - cron: "10 3 2 * *"      # il 2 di ogni mese: controllo bilanci nuovi, universo, prezzi e punteggio
  workflow_dispatch:
    inputs:
      steps:
        description: "Passi da eseguire"
        default: "universe,prices,fundamentals,score"
      limit:
        description: "Titoli per lotto di bilanci"
        default: "300"
      force:
        description: "Riscarica tutti i bilanci (true/false)"
        default: "false"

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      site: ${{ steps.site.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il modello
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          STEPS: ${{ github.event.inputs.steps || (github.event.schedule == '10 3 2 * *' && 'universe,fundamentals,prices,score') || 'prices,score' }}
          LIMIT: ${{ github.event.inputs.limit || '2000' }}
        run: |
          rm -f data/last_run.log
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          # processi separati: Yahoo invalida la sessione dopo i download massivi di prezzi
          for s in diag esefprobe universe fundamentals prices score; do
            case ",$STEPS," in *",$s,"*)
              python -m stockpicking.run --steps "$s" --limit "$LIMIT" $FORCE ;;
            esac
          done

      - name: Salva bilanci e universo nel repository
        if: always()
        run: |
          git config user.name "stockpicking-bot"
          git config user.email "actions@users.noreply.github.com"
          for p in data/universe.csv data/fundamentals data/last_run.log data/classifica_top100.csv data/track; do [ -e "$p" ] && git add "$p"; done
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati"
          else
            git commit -m "Aggiornamento dati $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Controlla la dashboard
        id: site
        run: |
          if [ -f docs/data/ranking.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - name: Prepara la dashboard
        if: steps.site.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    if: needs.update.outputs.site == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
