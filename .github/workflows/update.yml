name: Aggiornamento dati e dashboard

on:
  schedule:
    - cron: "40 22 * * 1-5"   # dal lunedì al venerdì, dopo la chiusura USA (00:40 ora italiana)
  workflow_dispatch:
    inputs:
      steps:
        description: "Passi da eseguire"
        default: "universe,prices,fundamentals,score"
      limit:
        description: "Titoli per lotto di bilanci"
        default: "300"
      force:
        description: "Riscarica tutti i bilanci (true/false)"
        default: "false"

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il modello
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python -m stockpicking.run \
            --steps "${{ github.event.inputs.steps || 'universe,prices,fundamentals,score' }}" \
            --limit "${{ github.event.inputs.limit || '300' }}" $FORCE

      - name: Salva bilanci e universo nel repository
        run: |
          git config user.name "stockpicking-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/universe.csv data/fundamentals || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati"
          else
            git commit -m "Aggiornamento dati $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Prepara la dashboard
        if: hashFiles('docs/data/ranking.json') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
